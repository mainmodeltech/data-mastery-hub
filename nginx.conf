server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip — améliore les performances (Core Web Vitals → SEO) ─────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Cache assets statiques (JS/CSS/images) ─────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Redirections SEO (anciennes URLs) ──────────────────────────────────
    # /services a été renommé /entreprises lors de la refonte du catalogue B2B.
    location = /services {
        return 301 /entreprises;
    }

    # ── Routing SPA + prerender ────────────────────────────────────────────
    # Grâce au script prerender.ts, chaque route a son propre index.html
    # dans un sous-dossier. Nginx sert d'abord ce fichier, puis fallback SPA.
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    # ── Sécurité basique ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
