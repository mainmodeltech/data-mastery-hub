version: '3.8'

services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: model-tech-demo-frontend
    environment:
      VITE_API_BASE_URL: http://192.168.181.6:8081/api
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    name: dokploy-network
    external: false
